# Render Blueprint Specification
# Free Tier Web Service + Managed PostgreSQL
services:
  - type: web
    name: earnloop-rewards-app
    env: node
    plan: free
    region: oregon # or frankfurt, singapore, ohio
    buildCommand: npm run build
    startCommand: npm run start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: earnloop-postgres-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_PIN
        value: EarnLoop@Admin#2026
      - key: SMS_MOCK_MODE
        value: "true"
      - key: FRONTEND_URL
        value: https://earnloop-rewards-app.onrender.com

databases:
  - name: earnloop-postgres-db
    plan: free
    region: oregon
    databaseName: earnloop
    user: earnloop_user
